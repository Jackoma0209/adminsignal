name: Quality and AdSense readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate AdSense configuration
        run: npm run check:adsense

      - name: Audit content quality and indexation
        id: quality
        shell: bash
        run: |
          set +e
          npm run check:quality > /tmp/content-quality.log 2>&1
          STATUS=$?
          tail -n 160 /tmp/content-quality.log
          exit $STATUS

      - name: Preserve content audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-quality-output
          path: /tmp/content-quality.log
          if-no-files-found: error

      - name: Production build
        run: npm run build

      - name: Audit rendered routes
        id: rendered_audit
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/adminsignal-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; cat /tmp/adminsignal-next.log' EXIT
          set +e
          npm run check:rendered > /tmp/rendered-site-audit.log 2>&1
          STATUS=$?
          tail -n 200 /tmp/rendered-site-audit.log
          exit $STATUS

      - name: Preserve rendered audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-site-audit-output
          path: /tmp/rendered-site-audit.log
          if-no-files-found: error
